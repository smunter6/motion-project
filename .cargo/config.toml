# Cargo aliases for this workspace.
#
#   cargo docs  ->  target/doc/index.html, this workspace's crates only
#
# `--no-deps` keeps dependency crates out of newly generated docs, but cargo
# never cleans `target/doc`. Remove it first if a bare `cargo doc` has already
# put dependency docs there.

[alias]
docs = "doc --workspace --no-deps"
